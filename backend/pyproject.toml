[project]
name = "ecom-image-backend"
version = "0.1.0"
description = "AI e-commerce image set generator backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3.0",
    "PyMySQL>=1.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
